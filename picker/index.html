<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Desktop 主题</title>
<style>
:root{
  --ink-900:#0e0e11;--ink-800:#15151a;--ink-700:#1c1c23;--ink-600:#24242c;
  --line:#2c2c35;--fog-500:#75757f;--fog-400:#9a9aa5;--fog-100:#e9e9ef;
  --accent:#d97757;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --pad:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink-900);color:var(--fog-100);font:14px/1.45 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:18px var(--pad) 14px;border-bottom:1px solid var(--line);background:linear-gradient(var(--ink-800),var(--ink-900))}
h1{margin:0;font-size:18px;font-weight:620;letter-spacing:-.01em}
#status{font-family:var(--mono);font-size:11px;color:var(--fog-500)}
#status .ok{color:#7ec89b}
#status .bad{color:#e08a8a}
.search{margin-left:auto;flex:1 1 200px;max-width:300px;min-width:140px}
.search input{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--ink-700);color:var(--fog-100);font:12px var(--mono)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
#revert{padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--ink-700);color:var(--fog-400);font-size:12px;cursor:pointer}
#revert:hover{border-color:var(--accent);color:var(--fog-100)}
main{flex:1 1 auto;overflow-y:auto;padding:4px var(--pad) 26px;scrollbar-width:thin;scrollbar-color:var(--ink-600) transparent}
section{margin-top:20px}
.eyebrow{margin:0 0 10px;font:10.5px var(--mono);color:var(--fog-500);letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--ink-800);padding:10px 11px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--fog-500);transform:translateY(-1px)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.card .name{font-size:12.5px;font-weight:560;margin:0 0 7px;display:flex;justify-content:space-between;gap:6px}
.card .name .slug{font:9.5px var(--mono);color:var(--fog-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.badge{font:9px var(--mono);color:#7ec89b;flex:none}
.prev{display:flex;flex-direction:column;gap:4px}
.prev .row{display:flex;align-items:center;gap:3px}
.prev .row .lab{font:8.5px var(--mono);color:var(--fog-500);width:10px;flex:none}
.chip{height:14px;flex:1;border-radius:3px;border:1px solid rgba(128,128,128,.25)}
.chip.dot{flex:0 0 14px;border-radius:50%}
.empty{color:var(--fog-500);font-size:12px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Claude Desktop 主题</h1>
    <span id="status">加载中…</span>
    <div class="search"><input id="q" type="search" placeholder="搜索主题 / slug…" autocomplete="off"></div>
    <button id="revert" title="清除注入, 恢复 Claude 原生外观">恢复默认</button>
  </header>
  <main id="main"><div class="empty">加载中…</div></main>
</div>
<script>
const hsl = v => !v ? '#555' : (v.startsWith('#') ? v : `hsl(${v})`);
let THEMES = [], active = '';

async function refresh() {
  const r = await fetch('/api/themes');
  const d = await r.json();
  THEMES = d.items; active = d.active;
  render();
  pollStatus();
}

async function pollStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    const el = document.getElementById('status');
    el.innerHTML =
      (s.injectedAlive ? '<span class="ok">主题注入已连接</span>'
        : !s.patched ? '<span class="bad">Claude 未 patch</span>'
        : s.claudeRunning ? '<span class="bad">注入端未连接</span>'
        : '<span class="bad">Claude 未运行</span>') +
      (s.activeTheme ? ` · 当前: ${s.activeTheme}` : ' · 原生外观') +
      (s.bgMode === 'slideshow'
        ? ` · 轮播中 ✓ (${s.bgCurrentSrc || '…'})`
        : s.background ? ' · 背景图 ✓' : '');
    if (!s.injectedAlive) {
      const btn = document.createElement('button');
      btn.textContent = '启动 Claude';
      btn.style.cssText = 'margin-left:8px;padding:2px 8px;font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--ink-700);color:var(--fog-100);cursor:pointer';
      btn.onclick = async () => {
        btn.textContent = '处理中…';
        const r = await fetch('/api/launch', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (!d.ok) alert(d.error || '启动失败');
        setTimeout(pollStatus, 4000);
      };
      el.appendChild(btn);
    }
    // 背景图控制: 上传 / 清除 (只挂一次)
    if (!document.getElementById('bgctl')) {
      const mk = (id, text) => {
        const b = document.createElement('button');
        b.id = id; b.textContent = text;
        b.style.cssText = 'margin-left:8px;padding:2px 8px;font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--ink-700);color:var(--fog-100);cursor:pointer';
        return b;
      };
      const up = mk('bgctl', '上传背景图');
      const file = document.createElement('input');
      file.type = 'file'; file.accept = 'image/png,image/jpeg,image/webp,image/gif'; file.hidden = true;
      up.onclick = () => file.click();
      file.onchange = async () => {
        const f = file.files[0];
        if (!f) return;
        up.textContent = '上传中…';
        const r = await fetch('/api/background', {
          method: 'POST',
          headers: { 'x-filename': encodeURIComponent(f.name) },
          body: f,
        });
        const d = await r.json();
        up.textContent = '上传背景图';
        if (!d.ok) alert(d.error || '上传失败');
        file.value = '';
        pollStatus();
      };
      el.appendChild(up); el.appendChild(file);
      const clr = mk('bgclear', '清除背景');
      clr.onclick = async () => { await fetch('/api/background/clear', { method: 'POST' }); pollStatus(); };
      el.appendChild(clr);
      // 轮播背景: 面板选文件夹 + 间隔
      const ss = mk('bgss', '轮播背景');
      ss.onclick = () => toggleSlideshowPanel();
      el.appendChild(ss);
      // 透明度滑杆: 值=表面不透明度(0 全透=图最清晰, 1 不透=纯色)
      const slider = (id, label, key) => {
        const wrap = document.createElement('label');
        wrap.id = id;
        wrap.style.cssText = 'margin-left:10px;font-size:11px;display:inline-flex;align-items:center;gap:4px;color:var(--fog-300)';
        const inp = document.createElement('input');
        inp.type = 'range'; inp.min = '0.1'; inp.max = '1'; inp.step = '0.02';
        const val = document.createElement('span');
        const apply = (() => { let t; return v => { clearTimeout(t); t = setTimeout(async () => {
          await fetch('/api/background/alpha', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ [key]: v }) });
        }, 250); }; })();
        inp.oninput = () => { val.textContent = inp.value; apply(Number(inp.value)); };
        wrap.append(label + ' ', inp, val);
        wrap.setVal = v => { inp.value = v; val.textContent = v; };
        return wrap;
      };
      const sMain = slider('bgaslider', '主区', 'bgAlpha');
      const sSide = slider('bgsslider', '侧栏', 'bgSideAlpha');
      el.appendChild(sMain); el.appendChild(sSide);
    }
    // 有背景时同步滑杆当前值并显示, 无背景时隐藏
    const mainS = document.getElementById('bgaslider');
    if (mainS) {
      const sideS = document.getElementById('bgsslider');
      const show = !!s.background;
      mainS.style.display = show ? '' : 'none';
      sideS.style.display = show ? '' : 'none';
      if (show) {
        mainS.setVal(s.bgAlpha ?? 0.5);
        sideS.setVal(s.bgSideAlpha ?? 0.68);
      }
    }
  } catch { /* 忽略 */ }
}

// 轮播设置面板: 文件夹路径 + 间隔(分钟) + 开启/关闭
function toggleSlideshowPanel() {
  let p = document.getElementById('sspanel');
  if (p) { p.hidden = !p.hidden; if (!p.hidden) fillSlideshowPanel(); return; }
  p = document.createElement('div');
  p.id = 'sspanel'; p.hidden = false;
  p.style.cssText = 'position:fixed;top:64px;right:22px;z-index:99;width:380px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--ink-800);box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:12px';
  p.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <b style="font-size:13px">轮播背景</b>
      <span id="ssmode" style="font:10.5px var(--mono);color:var(--fog-500)"></span>
    </div>
    <label style="display:block;margin-bottom:8px">背景图文件夹
      <span style="display:flex;gap:6px;margin-top:4px">
        <input id="ssfolder" type="text" placeholder="/Users/you/Pictures/wallpapers"
          style="flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--ink-700);color:var(--fog-100);font:11px var(--mono)">
        <button id="ssbrowse" title="弹出系统文件夹选择框" style="flex:none;padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--ink-700);color:var(--fog-100);cursor:pointer">选择…</button>
      </span>
    </label>
    <label style="display:block;margin-bottom:12px">切换间隔(分钟)
      <input id="ssinterval" type="number" min="1" max="1440" step="1" value="10"
        style="width:90px;margin-top:4px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--ink-700);color:var(--fog-100);font:11px var(--mono)">
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <span id="ssmsg" style="flex:1;font:10.5px var(--mono);color:var(--fog-500);align-self:center"></span>
      <button id="ssoff" style="padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--ink-700);color:var(--fog-400);cursor:pointer">关闭轮播</button>
      <button id="sson" style="padding:6px 12px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;cursor:pointer">开启轮播</button>
    </div>`;
  document.body.appendChild(p);
  // 原生文件夹选择框: 请求挂起到用户在系统弹窗里选完为止
  const browse = p.querySelector('#ssbrowse');
  browse.onclick = async () => {
    browse.textContent = '选择中…'; browse.disabled = true;
    try {
      const d = await (await fetch('/api/folder-picker')).json();
      if (d.ok) p.querySelector('#ssfolder').value = d.folder;
      else if (!d.canceled) alert(d.error || '选择失败');
    } catch { alert('选择失败: 无法连接 daemon'); }
    browse.textContent = '选择…'; browse.disabled = false;
  };
  p.querySelector('#sson').onclick = async () => {
    const msg = p.querySelector('#ssmsg');
    msg.textContent = '处理中…';
    const r = await fetch('/api/background/slideshow', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ mode: 'slideshow', folder: p.querySelector('#ssfolder').value.trim(), intervalMin: Number(p.querySelector('#ssinterval').value) || 10 }),
    });
    const d = await r.json();
    msg.textContent = '';
    if (!d.ok) { alert(d.error || '开启失败'); return; }
    p.hidden = true; pollStatus();
  };
  p.querySelector('#ssoff').onclick = async () => {
    await fetch('/api/background/slideshow', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mode: 'single' }) });
    p.hidden = true; pollStatus();
  };
  fillSlideshowPanel();
}

async function fillSlideshowPanel() {
  const p = document.getElementById('sspanel');
  if (!p) return;
  try {
    const s = await (await fetch('/api/status')).json();
    if (s.bgFolder) p.querySelector('#ssfolder').value = s.bgFolder;
    p.querySelector('#ssinterval').value = s.bgIntervalMin ?? 10;
    p.querySelector('#ssmode').textContent = s.bgMode === 'slideshow' ? '轮播中 ✓' : '未开启';
  } catch { /* 忽略 */ }
}

function card(t) {
  const div = document.createElement('div');
  div.className = 'card' + (t.id === active ? ' active' : '');
  const L = t.light, D = t.dark;
  div.innerHTML = `
    <p class="name"><span>${t.name}</span><span class="slug">${t.id}${t.id === active ? '<span class="badge"> ✓</span>' : ''}</span></p>
    <div class="prev">
      <div class="row"><span class="lab">L</span>
        <span class="chip" style="background:${hsl(L.bg)}"></span>
        <span class="chip" style="background:${hsl(L.bg2)}"></span>
        <span class="chip" style="background:${hsl(L.bg3)}"></span>
        <span class="chip dot" style="background:${hsl(L.accent)}"></span>
        <span class="chip dot" style="background:${hsl(L.text)}"></span>
      </div>
      <div class="row"><span class="lab">D</span>
        <span class="chip" style="background:${hsl(D.bg)}"></span>
        <span class="chip" style="background:${hsl(D.bg2)}"></span>
        <span class="chip" style="background:${hsl(D.bg3)}"></span>
        <span class="chip dot" style="background:${hsl(D.accent)}"></span>
        <span class="chip dot" style="background:${hsl(D.text)}"></span>
      </div>
    </div>`;
  div.onclick = async () => {
    const r = await fetch('/api/apply', { method: 'POST', body: JSON.stringify({ id: t.id }) });
    const d = await r.json();
    if (d.ok) { active = t.id; document.documentElement.style.setProperty('--accent', hsl(D.accent)); render(); }
    else alert(d.error || '应用失败');
  };
  return div;
}

function render() {
  const kw = document.getElementById('q').value.trim().toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const cats = [['builtin', '内置'], ['gaming', '游戏'], ['community', '社区'], ['custom', '自定义']];
  let shown = 0;
  for (const [c, label] of cats) {
    const group = THEMES.filter(t => t.category === c && (!kw || t.id.includes(kw) || t.name.toLowerCase().includes(kw)));
    if (!group.length) continue;
    shown += group.length;
    const sec = document.createElement('section');
    const eb = document.createElement('p');
    eb.className = 'eyebrow'; eb.textContent = `${label} · ${group.length}`;
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const t of group) grid.appendChild(card(t));
    sec.append(eb, grid); main.appendChild(sec);
  }
  if (!shown) main.innerHTML = '<div class="empty">没有匹配的主题</div>';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('revert').onclick = async () => {
  await fetch('/api/revert', { method: 'POST' });
  active = ''; render(); pollStatus();
};
refresh();
setInterval(pollStatus, 5000);
</script>
</body>
</html>
